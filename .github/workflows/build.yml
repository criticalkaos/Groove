name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            # Surface compiler errors as annotations so they are easy to read.
            grep -E '^e: |error:|ERROR:|AAPT' build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            grep -A12 'What went wrong' build.log | head -14 | tr '\n' ' ' | sed 's/^/::error::/'; echo
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Groove.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Groove
          path: Groove.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Groove 1.0.${{ github.run_number }}
          body: Download **Groove.apk** below on your phone and open it to install.
          files: Groove.apk
          make_latest: true
